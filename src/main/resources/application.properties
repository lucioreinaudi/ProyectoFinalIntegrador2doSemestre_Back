spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# JWT: el secreto se carga por variable de entorno, nunca en este archivo.
# Tiene que tener al menos 32 caracteres (lo exige el algoritmo HS256).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000