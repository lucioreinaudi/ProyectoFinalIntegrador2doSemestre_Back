# Perfil "test" (SCRUM-95): lo activan los tests con @ActiveProfiles("test").
# Los tests NUNCA usan la base de Supabase: usan H2, una base en memoria que se crea
# al arrancar y se borra al terminar. Estos valores pisan los de application.properties.

# H2 en memoria, en modo compatible con PostgreSQL (tipos como "text").
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas a partir de las entidades (en el back real es "validate").
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Clave de prueba para firmar los JWT (en el back real viene de JWT_SECRET).
# Tiene que tener al menos 32 caracteres. No es la clave real.
jwt.secret=clave-de-prueba-solo-para-tests-de-al-menos-32-caracteres
